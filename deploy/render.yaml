# Optional service-only Blueprint. Observer owns applying it after integration review.
# Existing warmpath-db stays separately managed; supply its INTERNAL URL privately.
# Do not also create a manual web service. Creation can trigger an initial deploy.
services:
  - type: web
    name: warmpath-web
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/xXThr0wnshadeXx/Projekt1
    branch: feat/ben-integration
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/packages/server/main.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: VITE_AUTH_MODE
        value: http
      - key: APP_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CONTACTS_REDIRECT_URI
        sync: false
      - key: PROVIDER_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
